<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E683A">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Avaliação Agronômica de Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Atkinson+Hyperlegible+Mono:wght@400..600&family=Atkinson+Hyperlegible+Next:wght@400..700&display=swap">
<style>
/* Layout: pasta de campo. Cada produtor é uma pasta com o tipo de teste na orelha; dentro dela, uma ficha em coluna única, as avaliações em ordem de estádio e a folha de contato das fotos. A ação principal fica numa barra fixa ao alcance do polegar. */
:root{
  --ground:#ECEFE7;
  --sheet:#FFFFFF;
  --sheet-2:#F4F6F1;
  --field:#FBFCFA;
  --ink:#17211A;
  --ink-2:#4F5D53;
  --ink-3:#7A867D;
  --rule:#D3DACF;
  --leaf:#2E683A;
  --leaf-hi:#24542E;
  --leaf-soft:#DCEADB;
  --on-leaf:#FFFFFF;
  --focus:#2E683A8C;
  --focus-soft:#2E683A2E;
  --elysian:#2A5B8A;
  --elysian-soft:#DDE7F1;
  --humaax:#8A5A1C;
  --humaax-soft:#F1E6D4;
  --other:#56625A;
  --other-soft:#E2E7E0;
  --on-tag:#FFFFFF;
  --danger:#B42318;
  --danger-soft:#FBE4E1;
  --on-danger:#FFFFFF;
  --shade:rgba(12,18,14,.55);
  --shadow:0 1px 2px rgba(23,33,26,.06),0 6px 16px rgba(23,33,26,.06);
  --badge-bg:rgba(10,14,11,.72);
  --badge-fg:#FFFFFF;
  --lb-bg:#0A0E0B;
  --lb-fg:#F0F3EF;
  --lb-dim:#A9B3AB;
  --lb-btn:rgba(255,255,255,.13);
  --lb-danger:#FF9C91;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D120F;--sheet:#161E18;--sheet-2:#1B241D;--field:#111813;
    --ink:#E4EBE4;--ink-2:#A2B0A5;--ink-3:#77857A;--rule:#2B372E;
    --leaf:#7DBF80;--leaf-hi:#95CE97;--leaf-soft:#20352A;--on-leaf:#0B150D;
    --focus:#7DBF808C;--focus-soft:#7DBF802E;
    --elysian:#86B4DE;--elysian-soft:#1B2C3C;--humaax:#D9A866;--humaax-soft:#36291A;
    --other:#A7B2AA;--other-soft:#262F28;--on-tag:#0D120F;
    --danger:#F28B80;--danger-soft:#3A1D1A;--on-danger:#1B0B09;
    --shade:rgba(0,0,0,.62);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D120F;--sheet:#161E18;--sheet-2:#1B241D;--field:#111813;
  --ink:#E4EBE4;--ink-2:#A2B0A5;--ink-3:#77857A;--rule:#2B372E;
  --leaf:#7DBF80;--leaf-hi:#95CE97;--leaf-soft:#20352A;--on-leaf:#0B150D;
  --focus:#7DBF808C;--focus-soft:#7DBF802E;
  --elysian:#86B4DE;--elysian-soft:#1B2C3C;--humaax:#D9A866;--humaax-soft:#36291A;
  --other:#A7B2AA;--other-soft:#262F28;--on-tag:#0D120F;
  --danger:#F28B80;--danger-soft:#3A1D1A;--on-danger:#1B0B09;
  --shade:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.28);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.ico{display:inline-flex;flex:none}
.ico svg{display:block}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3);font-weight:400}

.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:14px 140px}

/* marca */
.brand{padding-block:8px 18px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.brand img{display:block;height:34px;width:auto;max-width:100%}
.logo-on-dark{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-on-light{display:none!important}:root:not([data-theme="light"]) .logo-on-dark{display:block!important}}
:root[data-theme="dark"] .logo-on-light{display:none!important}
:root[data-theme="dark"] .logo-on-dark{display:block!important}

/* cabeçalhos */
.top{display:grid;gap:6px;padding-block:6px 4px}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.title-col{display:grid;gap:8px;min-width:0;justify-items:start}
.eyebrow{font-family:var(--f-display);font-weight:700;font-stretch:112.5%;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);overflow-wrap:anywhere}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:112.5%;font-size:clamp(28px,7.6vw,38px);line-height:1.04;letter-spacing:-.015em;text-wrap:balance;overflow-wrap:anywhere}
.count{font-size:15px;color:var(--ink-2);font-weight:500;padding-bottom:3px}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;min-width:0;max-width:100%;margin-left:-8px;padding-right:10px;text-decoration:none;color:var(--ink-2);font-weight:700;font-size:15px}
.back span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}

/* botões */
.btn{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);font:700 16px/1.1 var(--f-body);text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn[disabled]{opacity:.55;cursor:default;transform:none}
.btn-primary{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.btn-primary:hover{background:var(--leaf-hi);border-color:var(--leaf-hi)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.btn-danger:hover{border-color:var(--danger)}
.btn-quiet-danger{background:transparent;border-color:transparent;color:var(--danger);min-height:44px}
.btn-quiet-danger:hover{border-color:var(--danger-soft);background:var(--danger-soft)}
.btn-sm{min-height:42px;padding:0 14px;font-size:15px;border-radius:11px;flex:none}
.btn-ai{min-height:42px;padding:0 14px;font-size:14.5px;border-style:dashed;color:var(--leaf)}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--ink-2);width:44px;height:44px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--sheet-2);color:var(--ink)}
.icon-btn:focus-visible{outline:3px solid var(--focus);outline-offset:1px}

/* barra fixa */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--ground);background:color-mix(in srgb,var(--ground) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--rule)}
.bar-in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.bar-in>.btn{flex:1;min-height:54px;font-size:17px}

/* busca */
.search-wrap{padding-top:14px}
.search-wrap .input{min-height:48px}

/* pastas (abas de produtor) */
.folders{display:grid;gap:30px;padding-top:30px}
@media (min-width:640px){.folders{grid-template-columns:1fr 1fr;column-gap:16px}}
.folder{position:relative;display:block;min-width:0;text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent;--t:var(--other);--t-soft:var(--other-soft)}
.folder-tab{position:absolute;left:12px;bottom:100%;max-width:calc(100% - 24px);height:24px;padding:0 12px;border-radius:9px 9px 0 0;background:var(--t);color:var(--on-tag);font-family:var(--f-display);font-weight:700;font-stretch:125%;font-size:11px;line-height:24px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder-body{display:grid;gap:5px;background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--t);border-radius:5px 14px 14px 14px;padding:15px 16px 13px;box-shadow:var(--shadow);transition:transform .12s ease}
.folder:hover .folder-body{transform:translateY(-1px)}
.folder:active .folder-body{transform:translateY(1px)}
.folder:focus-visible{outline:none}
.folder:focus-visible .folder-body{outline:3px solid var(--focus);outline-offset:2px}
.folder-name{font-family:var(--f-display);font-weight:700;font-stretch:106%;font-size:20px;line-height:1.15;overflow-wrap:anywhere}
.folder-cons{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.folder-cons .muted{color:var(--ink-2);font-weight:400}
.folder-meta{color:var(--ink-2);font-size:15px;overflow-wrap:anywhere}
.folder-status{display:flex;align-items:center;gap:8px;margin-top:6px;padding-top:9px;border-top:1px dashed var(--rule);font-size:14px;color:var(--ink-2)}
.folder-status .dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink-3);flex:none}
.folder-status.done{color:var(--ink)}
.folder-status.done .dot{background:var(--leaf);border-color:var(--leaf)}
@media (prefers-reduced-motion:reduce){.folder-body{transition:none}}

.empty{display:grid;gap:6px;background:var(--sheet);border:1.5px dashed var(--rule);border-radius:14px;padding:20px 18px;color:var(--ink-2)}
.empty strong{color:var(--ink);font-size:17px}
.skel{height:112px;border-radius:14px;border:1px solid var(--rule);background:linear-gradient(90deg,var(--sheet) 0%,var(--sheet-2) 50%,var(--sheet) 100%);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.usage{margin:26px 0 0;font-size:13.5px;color:var(--ink-3)}
.hint{margin:0;font-size:14px;color:var(--ink-2)}

/* ficha do produtor */
.chip{display:inline-flex;align-items:center;max-width:100%;height:26px;padding:0 10px;border-radius:7px;background:var(--t-soft);color:var(--t);font-family:var(--f-display);font-weight:700;font-stretch:125%;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{display:grid;gap:10px;margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-t{margin:0;font-family:var(--f-display);font-weight:700;font-stretch:112.5%;font-size:13px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2)}
.ficha{margin:0;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,9.6em) minmax(0,1fr);gap:12px;padding:13px 16px;border-top:1px solid var(--rule);align-items:baseline}
.row:first-child{border-top:0}
.row dt{color:var(--ink-2);font-size:15px}
.row dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.row dd .pre{white-space:pre-line;font-weight:600}
.row dd small{display:block;font-weight:400;color:var(--ink-2);font-size:14px;margin-top:2px}

.evals{display:grid;gap:10px}
.etile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 14px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:14px;text-decoration:none;color:inherit;box-shadow:var(--shadow);-webkit-tap-highlight-color:transparent}
.etile:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.etile:active{transform:translateY(1px)}
.enum{width:48px;height:48px;border-radius:12px;background:var(--leaf-soft);color:var(--leaf);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-stretch:112.5%;font-size:19px}
.ebody{display:grid;gap:2px;min-width:0}
.etitle{font-weight:700;font-size:17px}
.esub{color:var(--ink-2);font-size:14.5px;overflow-wrap:anywhere}
.etile .ico{color:var(--ink-3)}
.estrip{grid-column:1/-1;display:flex;gap:6px;overflow:hidden;margin-top:8px}
.estrip img{width:54px;height:54px;object-fit:cover;border-radius:8px;flex:none;background:var(--sheet-2)}
.add-eval{appearance:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:1.5px dashed var(--rule);background:transparent;color:var(--leaf);font:700 16px/1 var(--f-body);cursor:pointer}
.add-eval:hover{border-color:var(--leaf)}
.add-eval:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.add-eval[disabled]{opacity:.55;cursor:default}

/* avaliação */
.card{display:grid;gap:14px;margin-top:20px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px}
.sec .card{margin-top:0}
.two{display:grid;gap:16px}
@media (min-width:540px){.two{grid-template-columns:1fr 1fr}}
.field{display:grid;gap:7px;min-width:0;align-content:start}
.field>label,.flabel{font-weight:700;font-size:15px}
.input{display:block;width:100%;min-width:0;min-height:52px;padding:0 14px;border-radius:11px;border:1.5px solid var(--rule);background:var(--field);color:var(--ink);font:500 17px/1.25 var(--f-body);-webkit-appearance:none;appearance:none}
.input::placeholder{color:var(--ink-3);font-weight:400}
.input:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 3px var(--focus-soft)}
.input[aria-invalid="true"]{border-color:var(--danger)}
.input[disabled]{opacity:.7}
.input.stage{font-family:var(--f-data);font-size:24px;font-weight:600;letter-spacing:.02em}
textarea.input.area{min-height:132px;padding:12px 14px;line-height:1.45;resize:vertical;overflow:hidden}
textarea#f-padrao{min-height:96px;overflow:auto}
input[type="date"].input{line-height:50px;text-align:left}
input[type="date"].input::-webkit-date-and-time-value{text-align:left}
input[type="search"].input::-webkit-search-decoration{-webkit-appearance:none}
.err{margin:0;color:var(--danger);font-size:14px;font-weight:700}
.save-state{margin:0;min-height:20px;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.save-state.bad{color:var(--danger);font-weight:700}
.danger-zone{display:flex;justify-content:center;margin-top:30px}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ph{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:1/1;padding:0;border:0;border-radius:9px;overflow:hidden;background:var(--sheet-2);cursor:pointer;-webkit-tap-highlight-color:transparent}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ph-n{position:absolute;left:5px;top:5px;min-width:24px;height:22px;padding:0 6px;border-radius:6px;background:var(--badge-bg);color:var(--badge-fg);font:600 12px/22px var(--f-data);text-align:center}
.ph.q{border:1.5px dashed var(--rule);cursor:default}
.ph.q img{opacity:.45}
.ph.err{border:1.5px solid var(--danger);background:var(--danger-soft);cursor:pointer}
.ph-veil{position:absolute;inset:0;display:grid;place-items:center}
.ph-msg{position:absolute;left:0;right:0;bottom:0;padding:5px 6px;font-size:12px;font-weight:700;line-height:1.2;text-align:center;background:var(--badge-bg);color:var(--badge-fg)}
.ph.err .ph-veil{color:var(--danger)}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid var(--rule);border-top-color:var(--leaf);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* janelas */
dialog{color:var(--ink)}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 12px);margin:auto auto 0;padding:0;border:0;border-radius:20px 20px 0 0;background:var(--sheet);box-shadow:var(--shadow);overscroll-behavior:contain}
.sheet::backdrop{background:rgba(12,18,14,.55);background:var(--shade,rgba(12,18,14,.55))}
@media (min-width:640px){.sheet{margin:auto;border-radius:20px}}
.sheet-in{display:grid;gap:18px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h h2,.sheet-t{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:112.5%;font-size:23px;line-height:1.1;overflow-wrap:anywhere}
.sheet-p{margin:0;color:var(--ink-2)}
.sheet-actions{display:flex;gap:10px}
.sheet-actions .btn{flex:1}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{--t:var(--leaf);--t-soft:var(--leaf-soft);appearance:none;min-height:46px;padding:0 18px;border-radius:999px;border:1.5px solid var(--rule);background:var(--field);color:var(--ink);font:700 15px/1 var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pill::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--t);flex:none}
.pill.other::before{background:transparent;border:2px solid var(--ink-3);width:6px;height:6px}
.pill.pill-sm{min-height:40px;padding:0 14px;font-size:14px}
.pill.pill-sm::before{display:none}
.pill[aria-pressed="true"]{background:var(--t-soft);border-color:var(--t);box-shadow:inset 0 0 0 1px var(--t)}
.pill:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.add-opt{appearance:none;justify-self:start;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;border-radius:11px;border:1.5px dashed var(--rule);background:transparent;color:var(--leaf);font:700 15px/1 var(--f-body);cursor:pointer}
.add-opt:hover{border-color:var(--leaf)}
.add-opt:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.with-x{display:flex;gap:6px;align-items:center}
.ai-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sug{display:grid;gap:10px;padding:12px 14px;border-radius:11px;background:var(--sheet-2);border:1px solid var(--rule);font-size:14.5px;color:var(--ink-2)}
.sug b{color:var(--ink)}
.sug .btn{justify-self:start}
.prog{height:8px;border-radius:99px;background:var(--sheet-2);border:1px solid var(--rule);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--leaf);transition:width .2s ease}
.checks{display:grid;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.check{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border-top:1px solid var(--rule);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:22px;height:22px;margin:0;accent-color:var(--leaf);flex:none}
.check span{display:grid;min-width:0}
.check small{color:var(--ink-2);font-size:14px;overflow-wrap:anywhere}

/* visualizador de foto */
.lb{position:fixed;inset:0;z-index:40;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--lb-bg);color:var(--lb-fg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb-top,.lb-bot{display:flex;align-items:center;gap:10px;padding:8px 12px}
.lb-top{justify-content:space-between}
.lb-count{font:600 15px/1 var(--f-data);color:var(--lb-fg);padding-left:6px}
.lb-stage{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden}
.lb-stage img{display:block;max-width:100%;max-height:100%;object-fit:contain}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:68px;border:0;border-radius:12px;background:var(--lb-btn);color:var(--lb-fg);display:grid;place-items:center;cursor:pointer}
.lb-prev{left:8px}
.lb-next{right:8px}

  if (ifd + 2 > end) return 1;
  var n = r16(ifd);
  for (var i = 0; i < n; i++) {
    var e = ifd + 2 + i * 12;
    if (e + 12 > end) return 1;
    if (r16(e) === 0x0112) { var v = r16(e + 8); return (v >= 1 && v <= 8) ? v : 1; }
  }
  return 1;
}

/* Matriz que desenha a imagem original (sem recompressão) já na orientação correta,
   ocupando a caixa (x, y, w, h) da página. */
function orientMatrix(o, x, y, w, h) {
  switch (o) {
    case 2: return [-w, 0, 0, h, x + w, y];
    case 3: return [-w, 0, 0, -h, x + w, y + h];
    case 4: return [w, 0, 0, -h, x, y + h];
    case 5: return [0, -h, -w, 0, x + w, y + h];
    case 6: return [0, -h, w, 0, x, y + h];
    case 7: return [0, h, w, 0, x, y];
    case 8: return [0, h, -w, 0, x + w, y];
    default: return [w, 0, 0, h, x, y];
  }
}

/* Monta o relatório: dados do produtor, resumo das avaliações e uma seção por avaliação.
   JPEG entra byte a byte (DCT original); PNG entra sem perda. */
async function buildReportPdf(L, info, opts) {
  opts = opts || {};
  var evs = info.avaliacoes || [];
  var doc = await L.PDFDocument.create();
  var F = await doc.embedFont(L.StandardFonts.Helvetica);
  var FB = await doc.embedFont(L.StandardFonts.HelveticaBold);
  doc.setTitle('Relatório de avaliação – ' + (info.nome || ''));
  doc.setSubject([info.teste, info.cultivar].filter(Boolean).join(' · '));
  doc.setCreator('Avaliação Agronômica de Campo');
  doc.setLanguage('pt-BR');

  var C = {
    ink: L.rgb(0.09, 0.13, 0.10), ink2: L.rgb(0.34, 0.39, 0.35), rule: L.rgb(0.80, 0.84, 0.79),
    leaf: L.rgb(0.18, 0.41, 0.23), leafSoft: L.rgb(0.74, 0.86, 0.75), panel: L.rgb(0.945, 0.957, 0.935), white: L.rgb(1, 1, 1)
  };
  var PW = 595.28, PH = 841.89, M = 42, CW = PW - 2 * M, BOTTOM = 58;
  var pages = [], page = null, y = 0, tag = '', cont = '';
  function newPage() {
    page = doc.addPage([PW, PH]);
    pages.push({ page: page, tag: tag });
    y = PH - M;
    if (cont) { draw(cont + ' (continuação)', M, y - 8, 8.5, FB, C.ink2); y -= 24; }
  }
  function tw(s, size, font) { return (font || F).widthOfTextAtSize(pdfSafe(s), size); }
  function draw(s, x, yy, size, font, color) { s = pdfSafe(s); if (s) page.drawText(s, { x: x, y: yy, size: size, font: font || F, color: color || C.ink }); }
  function ellipsis(s, size, font, max) {
    s = pdfSafe(s);
    if (max <= 0) return '';
    if (tw(s, size, font) <= max) return s;
    while (s.length > 1 && tw(s + '…', size, font) > max) s = s.slice(0, -1);
    return s.replace(/\s+$/, '') + '…';
  }
  function wrap(s, size, font, max) {
    var words = pdfSafe(s).split(/\s+/).filter(Boolean), lines = [], cur = '';
    words.forEach(function (w) {
      var t = cur ? cur + ' ' + w : w;
      if (tw(t, size, font) <= max) { cur = t; return; }
      if (cur) lines.push(cur);
      if (tw(w, size, font) <= max) { cur = w; return; }
      var part = '';
      for (var ch of w) { if (part && tw(part + ch, size, font) > max) { lines.push(part); part = ch; } else part += ch; }
      cur = part;
    });
    if (cur) lines.push(cur);
    return lines.length ? lines : [''];
  }
  function hline(yy, th, color) { page.drawLine({ start: { x: M, y: yy }, end: { x: M + CW, y: yy }, thickness: th, color: color }); }
  function ensure(hgt) { if (y - hgt < BOTTOM) newPage(); }
  function label(t, after, need) {
    ensure(need || 40);
    draw(t.toUpperCase(), M, y - 8, 8.5, FB, C.ink2);
    y -= (after == null ? 15 : after);
  }
  function rows(list) {
    var KW = 150, VW = CW - KW, size = 10.5, lh = 14;
    list.forEach(function (r) {
      var lines = [];
      String(r[1]).replace(/\r\n?/g, '\n').split('\n').forEach(function (par) { if (par.trim()) lines = lines.concat(wrap(par, size, FB, VW)); });
      if (!lines.length) lines = ['—'];
      var kLines = wrap(r[0], 9.5, F, KW - 10);
      while (lines.length < kLines.length) lines.push('');
      ensure(lines.length * lh + 10);
      hline(y, 0.6, C.rule);
      var b = y - 15;
      kLines.forEach(function (ln, i) { draw(ln, M, b - i * lh, 9.5, F, C.ink2); });
      lines.forEach(function (ln, i) { draw(ln, M + KW, b - i * lh, size, FB, C.ink); });
      y = b - (lines.length - 1) * lh - 7;
    });
    hline(y, 0.6, C.rule);
    y -= 26;
  }
  function table(cols, data) {
    var hh = 22, rh = 22;
    ensure(hh + rh);
    page.drawRectangle({ x: M, y: y - hh, width: CW, height: hh, color: C.panel });
    var x = M;
    cols.forEach(function (c) { draw(c.t.toUpperCase(), x + 8, y - 14.5, 7.5, FB, C.ink2); x += c.w; });
    y -= hh;
    data.forEach(function (r) {
      ensure(rh);
      var xx = M;
      r.forEach(function (v, j) { var f = j === 0 ? FB : F; draw(ellipsis(v, 9.5, f, cols[j].w - 14), xx + 8, y - 14.5, 9.5, f, C.ink); xx += cols[j].w; });
      y -= rh;
      hline(y, 0.5, C.rule);
    });
  }

  /* ---- página 1: identificação e resumo ---- */
  newPage();
  var gerado = 'Gerado em ' + fmtDate(info.geradoEm || todayISO());
  var titRel = 'RELATÓRIO DE AVALIAÇÃO AGRONÔMICA';
  var logo = null;
  if (info.logo) { try { logo = await doc.embedPng(info.logo); } catch (err) { logo = null; } }
  if (logo) {
    var lh = 30, lw = lh * logo.width / logo.height;
    page.drawImage(logo, { x: M, y: y - lh, width: lw, height: lh });
    draw(titRel, PW - M - tw(titRel, 8.5, FB), y - 11, 8.5, FB, C.leaf);
    draw(gerado, PW - M - tw(gerado, 8.5, F), y - 24, 8.5, F, C.ink2);
    y -= lh + 28;
  } else {
    draw(titRel, M, y - 8, 8.5, FB, C.leaf);
    draw(gerado, PW - M - tw(gerado, 8.5, F), y - 8, 8.5, F, C.ink2);
    y -= 34;
  }
  draw('Produtor', M, y, 9.5, F, C.ink2);
  y -= 24;
  wrap(info.nome || 'Sem nome', 21, FB, CW).forEach(function (ln, i) { if (i) y -= 25; draw(ln, M, y, 21, FB, C.ink); });
  y -= 14;
  page.drawLine({ start: { x: M, y: y }, end: { x: M + CW, y: y }, thickness: 1.4, color: C.leaf });
  y -= 24;

  label('Dados do produtor');
  var dados = [];
  if (info.consultor) dados.push(['Consultor responsável', info.consultor]);
  if (info.assistente) dados.push(['Assistente responsável', info.assistente]);
  dados.push(['Tipo de teste', info.teste || '—']);
  if (info.dose) dados.push(['Dose do teste', info.dose]);
  if (info.padraoFazenda) dados.push(['Tratamento padrão da fazenda', info.padraoFazenda]);
  dados.push(['Cultivar', info.cultivar || '—']);
  if (info.ciclo) dados.push(['Ciclo da cultivar', info.ciclo]);
  if (typeof info.sementesMetro === 'number' && isFinite(info.sementesMetro)) dados.push(['Sementes por metro', fmtNum(info.sementesMetro)]);
  dados.push(['Data de plantio', fmtDate(info.dataPlantio) || '—']);
  rows(dados);

  label('Resumo das avaliações', 12);
  if (!evs.length) {
    draw('Nenhuma avaliação registrada.', M, y - 10, 10, F, C.ink2);
    y -= 30;
  } else {
    table([{ t: 'Avaliação', w: 150 }, { t: 'Estádio', w: 105 }, { t: 'Data', w: 95 }, { t: 'DAP', w: 70 }, { t: 'Fotos', w: CW - 420 }],
      evs.map(function (ev) {
        var d = daysBetween(info.dataPlantio, ev.data);
        return [ev.titulo, ev.estadio || '—', fmtDate(ev.data) || '—', d != null && d >= 0 ? String(d) : '—', String((ev.fotos || []).length)];
      }));
    draw('DAP: dias após o plantio. Cada avaliação aparece a seguir em uma seção própria.', M, y - 14, 8, F, C.ink2);
    y -= 30;
  }

  /* ---- uma seção por avaliação ---- */
  var G = 14, cellW = (CW - G) / 2, maxH = 312, capH = 14;
  for (var e = 0; e < evs.length; e++) {
    var ev = evs[e];
    var fotos = ev.fotos || [];
    tag = ev.curto + ' avaliação' + (ev.estadio ? ' · ' + ev.estadio : '');
    cont = '';
    newPage();
    cont = ev.titulo + (ev.estadio ? ' · Estádio ' + ev.estadio : '');

    var bh = 36;
    page.drawRectangle({ x: M, y: y - bh, width: CW, height: bh, color: C.leaf });
    var right = ev.estadio ? 'ESTÁDIO ' + String(ev.estadio).toUpperCase() : '';
    var rwid = right ? Math.min(tw(right, 13, FB), CW * 0.5) : 0;
    draw(ellipsis(ev.titulo.toUpperCase(), 13, FB, CW - 36 - rwid), M + 12, y - 23, 13, FB, C.white);
    if (right) draw(ellipsis(right, 13, FB, CW * 0.5), M + CW - 12 - rwid, y - 23, 13, FB, C.white);
    y -= bh + 18;

    var dd = daysBetween(info.dataPlantio, ev.data);
    var meta = (ev.data ? 'Avaliada em ' + fmtDate(ev.data) : 'Data da avaliação não informada') +
      (dd != null && dd >= 0 ? ' · ' + dapLabel(dd) : '') + ' · ' + fotos.length + (fotos.length === 1 ? ' foto' : ' fotos');
    draw(meta, M, y - 4, 10, F, C.ink2);
    y -= 28;

    var pp = typeof ev.popPadrao === 'number' ? ev.popPadrao : null, pt = typeof ev.popTeste === 'number' ? ev.popTeste : null;
    if (pp != null || pt != null) {
      label('População final (plantas/m)', 12);
      var nomeTeste = 'Teste' + (info.teste ? ' (' + info.teste + (info.dose ? ' ' + info.dose : '') + ')' : '');
      var w3 = CW / 3;
      table([{ t: 'Padrão fazenda', w: w3 }, { t: nomeTeste, w: w3 }, { t: 'Diferença do teste', w: CW - 2 * w3 }],
        [[pp != null ? fmtNum(pp) : '—', pt != null ? fmtNum(pt) : '—', (pp != null && pt != null) ? popDiff(pp, pt) : '—']]);
      y -= 26;
    }

    label('Observações', 14);
    var obs = String(ev.obs || '').replace(/\r\n?/g, '\n').trim();
    if (obs) {
      obs.split('\n').forEach(function (par) {
        (par.trim() ? wrap(par, 10.5, F, CW - 16) : ['']).forEach(function (ln) {
          ensure(15);
          page.drawRectangle({ x: M, y: y - 15, width: 2.5, height: 15, color: C.leafSoft });
          draw(ln, M + 12, y - 11, 10.5, F, C.ink);
          y -= 15;
        });
      });
    } else {
      draw('Sem observações registradas.', M, y - 11, 10.5, F, C.ink2);
      y -= 15;
    }
    y -= 26;

    var items = [];
    for (var i = 0; i < fotos.length; i++) {
      var ph = fotos[i], it = { n: i + 1, nome: ph.nome || '' };
      if (opts.onProgress) opts.onProgress(e, i, fotos.length);
      try {
        if (ph.missing || !ph.bytes) throw new Error('indisponível');
        var bytes = ph.bytes, kind = sniffImage(bytes);
        if (kind !== 'image/jpeg' && kind !== 'image/png') {
          if (!opts.toPng) throw new Error('formato');
          bytes = await opts.toPng(bytes, kind || ph.tipo);
          kind = 'image/png';
        }
        if (kind === 'image/jpeg') { it.img = await doc.embedJpg(bytes); it.o = exifOrientation(bytes); }
        else { it.img = await doc.embedPng(bytes); it.o = 1; }
        var rw = it.img.width, rh = it.img.height, swap = it.o >= 5;
        var dw = swap ? rh : rw, dh = swap ? rw : rh;
        var s = Math.min(cellW / dw, maxH / dh);
        it.w = dw * s; it.h = dh * s;
      } catch (err) { it.fail = true; it.w = cellW; it.h = 120; }
      items.push(it);
    }
    var firstRow = items.length ? Math.max.apply(null, items.slice(0, 2).map(function (q) { return q.h; })) + 8 + capH : 30;
    label('Registro fotográfico', 18, 24 + firstRow);
    if (!items.length) { draw('Nenhuma foto registrada nesta avaliação.', M, y - 6, 10, F, C.ink2); y -= 24; }
    for (var r = 0; r < items.length; r += 2) {
      var row = items.slice(r, r + 2);
      var rowH = Math.max.apply(null, row.map(function (q) { return q.h; })) + 8 + capH;
      if (y - rowH < BOTTOM) newPage();
      row.forEach(function (q, k) {
        var cx = M + k * (cellW + G);
        var x = q.fail ? cx : cx + (cellW - q.w) / 2;
        var yb = y - q.h;
        if (q.fail) {
          page.drawRectangle({ x: cx, y: yb, width: cellW, height: q.h, color: C.panel, borderColor: C.rule, borderWidth: 0.6 });
          var msg = 'Foto ' + q.n + ' indisponível';
          draw(msg, cx + (cellW - tw(msg, 9.5, FB)) / 2, yb + q.h / 2 - 3, 9.5, FB, C.ink2);
        } else {
          var key = page.node.newXObject('Image', q.img.ref);
          var m = orientMatrix(q.o, x, yb, q.w, q.h);
          page.pushOperators(L.pushGraphicsState(), L.concatTransformationMatrix(m[0], m[1], m[2], m[3], m[4], m[5]), L.drawObject(key), L.popGraphicsState());
          page.drawRectangle({ x: x, y: yb, width: q.w, height: q.h, borderColor: C.rule, borderWidth: 0.5 });
        }
        var lab = 'Foto ' + q.n, capY = yb - 8 - 7;
        draw(lab, x, capY, 8.5, FB, C.ink);
        var lw = tw(lab, 8.5, FB) + 6;
        if (q.nome) draw(ellipsis(q.nome, 8, F, q.w - lw), x + lw, capY, 8, F, C.ink2);
      });
      y -= rowH + G;
    }
  }
  cont = '';

  var total = pages.length;
  pages.forEach(function (pg, idx) {
    page = pg.page;
    hline(M - 6, 0.5, C.rule);
    var right = 'Página ' + (idx + 1) + ' de ' + total, rwid = tw(right, 8, F);
    draw(right, PW - M - rwid, M - 20, 8, F, C.ink2);
    draw(ellipsis([info.nome, info.cultivar, pg.tag].filter(Boolean).join(' · '), 8, F, CW - rwid - 18), M, M - 20, 8, F, C.ink2);
  });
  return await doc.save();
}
</script>

  async function excluirAvaliacao(pid, key) {
    var p = S.produtores.get(pid);

    var n = fotosDe(pid, key).length;
    var ok = await confirmDialog({
      title: 'Excluir a ' + ordTitulo(idx).toLowerCase() + '?',

      ok: 'Excluir avaliação'
    });
    if (!ok) return;
    if (mounted && mounted.cancelSave) mounted.cancelSave();
    var prog = openProgress('Excluindo avaliação', 'Apagando fotos…');
    try {
      var snap = await fotosCol(pid).where('aval', '==', key).get();
      var i = 0;
      for (var d of snap.docs) {
        i++;
        prog.set('Apagando foto ' + i + ' de ' + snap.size + '…', i / (snap.size + 1));
        var aid = (d.data() || {}).assetId;
        await dbw(function () { return fotosCol(pid).doc(d.id).delete(); });
        if (S.assets && aid) { try { await S.assets.delete(aid); } catch (x) { /* arquivo já removido */ } }
      }
      var now = new Date().toISOString();
      var patch = { avaliacoes: {}, atualizadoEm: now };
      patch.avaliacoes[key] = { removida: true, estadio: '', obs: '', nFotos: 0, atualizadoEm: now };
      await dbw(function () { return prodRef(pid).update(patch); });
      prog.close();
      toast('Avaliação excluída');
      go('p-' + pid);
      loadUsage();
    } catch (e) { prog.close(); toast(dbErrMsg(e), true); maybeReadOnly(e); }
  }

  var tiles = new Map();
  function photoTile(f, n, pid, key) {
    var k = 'f:' + f.id, sig = n + '|' + (f.thumb ? 1 : 0);
    var c = tiles.get(k);
    if (c && c.sig === sig) return c.el;
    var el = h('button', { type: 'button', class: 'ph', 'aria-label': 'Abrir foto ' + n, onclick: function () { openLightbox(pid, key, f.id); } },
      h('img', { src: f.thumb || srcFoto(f), alt: '', decoding: 'async' }),

  function queueTile(it) {

  /* ---------- envio das fotos (arquivo original, sem alteração) ---------- */
  $('#fotos-input').addEventListener('change', function (e) {
    var files = Array.from(e.target.files || []);
    e.target.value = '';
    var t = S.uploadTarget;
    if (!t || !files.length) return;
    files.forEach(function (f) { S.queue.push({ qid: newId('q'), pid: t.pid, key: t.key, file: f, name: f.name || 'foto', status: 'wait' }); });
    render();
    processQueue();
  });

  async function processQueue() {
    if (S.uploading) return;
    S.uploading = true;
    wake(true);
    var touched = new Set();
    try {
      var it;
      while ((it = S.queue.find(function (x) { return x.status === 'wait'; }))) {
        it.status = 'up';
        render();
        try {
          await uploadOne(it);
          S.queue = S.queue.filter(function (x) { return x !== it; });
          touched.add(it.pid + '|' + it.key);
        } catch (e) {
          if (e && e.code === 'dup') {
            S.queue = S.queue.filter(function (x) { return x !== it; });
            toast('Foto repetida ignorada: ' + it.name);
          } else {
            it.status = 'err'; it.code = e && e.code; it.msg = uploadErrMsg(e);
            if (it.code === 'invalid_argument') maybeReadOnly(e);
          }
        }
        render();
      }
    } finally {
      S.uploading = false;
      wake(false);
    }
    for (var k of touched) {
      var parts = k.split('|');
      try { await syncSummary(parts[0], parts[1]); } catch (e) { /* o resumo se corrige na próxima alteração */ }
    }
    if (touched.size) loadUsage();
    var failed = S.queue.filter(function (x) { return x.status === 'err'; }).length;
    if (failed) toast(failed === 1 ? '1 foto não foi enviada. Toque nela para ver o motivo.' : failed + ' fotos não foram enviadas. Toque nelas para ver o motivo.', true);
  }

  async function uploadOne(it) {
    var f = it.file;
    if (!S.assets) throw { code: 'not_granted' };
    if (f.size > MAX_BYTES) throw { code: 'too_large' };
    var buf = await f.arrayBuffer();
    var u8 = new Uint8Array(buf);
    var type = sniffImage(u8);
    if (type === 'heic' || (!type && /hei[cf]/i.test(f.type || ''))) throw { code: 'heic' };
    if (!type) throw { code: 'unsupported_type' };
    var sha = null;
    try { sha = hex(await crypto.subtle.digest('SHA-256', buf)); } catch (e) { sha = null; }
    if (sha && S.fotosPid === it.pid && S.fotos.some(function (x) { return x.aval === it.key && x.sha256 === sha; })) throw { code: 'dup' };
    var orient = type === 'image/jpeg' ? exifOrientation(u8) : 1;
    u8 = null; buf = null;
    var prev = null;
    try { prev = await makeThumb(f); } catch (e) { prev = null; }
    if (prev) { it.thumb = prev.thumb; render(); }
    var res;
    try { res = await S.assets.upload(f, { type: type }); }
    catch (e) {
      if (e && e.code === 'store_unavailable') { await sleep(1500); res = await S.assets.upload(f, { type: type }); }
      else throw e;
    }
    var fid = newId('f');
    var doc = {
      aval: it.key, assetId: res.id, url: (res.url && /^https?:/.test(res.url)) ? res.url : null, nome: f.name || 'foto', tipo: type, bytes: f.size, bytesServidor: res.sizeBytes,
      sha256: sha, largura: prev ? prev.w : null, altura: prev ? prev.h : null, orientacao: orient,
      ordem: Date.now(), thumb: prev ? prev.thumb : null, criadoEm: new Date().toISOString()
    };
    try { await dbw(function () { return S.db.doc('produtores/' + it.pid + '/fotos/' + fid).set(doc); }); }
    catch (e) { try { await S.assets.delete(res.id); } catch (x) { /* sem registro, o arquivo fica órfão */ } throw e; }
  }

  async function makeThumb(file) {
    var url = URL.createObjectURL(file);
    try {
      var img = new Image();
      img.src = url;
      await img.decode();
      var w = img.naturalWidth, hh = img.naturalHeight;
      if (!w || !hh) return null;
      var s = Math.min(1, 360 / Math.max(w, hh));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(hh * s));
      var ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, c.width, c.height);
      return { thumb: c.toDataURL('image/jpeg', 0.72), w: w, h: hh };
    } finally { URL.revokeObjectURL(url); }
  }

  function uploadErrMsg(e) {
    switch (e && e.code) {
      case 'too_large': return 'A foto tem mais de 20 MB, o limite do armazenamento por arquivo.';
      case 'heic': return 'A foto está em HEIC. No iPhone, ative Ajustes › Câmera › Formatos › Mais Compatível e tire a foto de novo.';
      case 'unsupported_type': return 'Formato não aceito. Envie fotos em JPG ou PNG.';
      case 'quota_or_state': return 'O espaço de armazenamento do app acabou. Exclua fotos que não precisa mais.';
      case 'rate_limited': return 'Muitos envios seguidos. Espere alguns segundos e tente de novo.';
      case 'upstream_auth': return 'Sua sessão expirou. Recarregue a página e tente de novo.';
      case 'not_granted': case 'capability_disabled': case 'capability_removed': return 'O envio de fotos não está disponível nesta visualização.';
      case 'invalid_argument': return 'Este acesso permite só visualizar.';
      case 'quota_exceeded': return 'O banco de dados do app está cheio.';
      case 'storage_off': return 'O armazenamento de fotos ainda não foi ativado no Firebase (Storage no plano Blaze).';
      case 'storage_rules': return 'As regras do armazenamento de fotos bloquearam o envio.';
      default: return 'Não foi possível enviar. Verifique a conexão e tente de novo.';
    }
  }

    d.showModal();

  /* ---------- visualizador ---------- */
  var LB = { pid: null, key: null, id: null, x0: null };
  function lbList() { return fotosDe(LB.pid, LB.key); }
  function openLightbox(pid, key, id) {
    LB.pid = pid; LB.key = key; LB.id = id;
    $('#lb').hidden = false;
    document.body.classList.add('noscroll');
    lbRender();
    $('#lb-close').focus();
  }
  function closeLightbox() {
    $('#lb').hidden = true;
    document.body.classList.remove('noscroll');
    var img = $('#lb-img');
    img.removeAttribute('src'); delete img.dataset.id;
  }
  function lbRender() {
    var list = lbList();
    var i = list.findIndex(function (f) { return f.id === LB.id; });
    if (i < 0) { closeLightbox(); return; }
    var f = list[i];
    $('#lb-count').textContent = (i + 1) + ' / ' + list.length;
    var img = $('#lb-img');
    if (img.dataset.id !== f.id) {
      img.dataset.id = f.id;
      if (f.thumb) img.src = f.thumb; else img.removeAttribute('src');
      $('#lb-load').hidden = false;
      var full = new Image();
      full.onload = function () { if (img.dataset.id === f.id) { img.src = full.src; $('#lb-load').hidden = true; } };
      full.onerror = function () { if (img.dataset.id === f.id) $('#lb-load').textContent = 'Não foi possível carregar o original.'; };
      $('#lb-load').textContent = 'Carregando original…';
      full.src = srcFoto(f);
    }
    img.alt = 'Foto ' + (i + 1);
    $('#lb-name').textContent = f.nome || 'Foto ' + (i + 1);
    $('#lb-info').textContent = [f.largura && f.altura ? f.largura + ' × ' + f.altura + ' px' : null, f.bytes ? fmtBytes(f.bytes) : null, 'original'].filter(Boolean).join(' · ');
    $('#lb-prev').hidden = i === 0;
    $('#lb-next').hidden = i === list.length - 1;
    $('#lb-del').hidden = !(S.canWrite && S.assets);
    $('#lb-dl').hidden = !S.downloads;
  }
  function lbStep(d) {
    var list = lbList(), i = list.findIndex(function (f) { return f.id === LB.id; });
    var nx = list[i + d];
    if (nx) { LB.id = nx.id; lbRender(); }
  }
  $('#lb-close').addEventListener('click', closeLightbox);
  $('#lb-prev').addEventListener('click', function () { lbStep(-1); });
  $('#lb-next').addEventListener('click', function () { lbStep(1); });
  $('#lb-stage').addEventListener('touchstart', function (e) { LB.x0 = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
  $('#lb-stage').addEventListener('touchend', function (e) {
    if (LB.x0 == null || !e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - LB.x0;
    LB.x0 = null;
    if (Math.abs(dx) > 60) lbStep(dx < 0 ? 1 : -1);
  }, { passive: true });
  document.addEventListener('keydown', function (e) {
    if ($('#lb').hidden || document.querySelector('dialog[open]')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') lbStep(-1);
    else if (e.key === 'ArrowRight') lbStep(1);
  });
  $('#lb-del').addEventListener('click', async function () {
    var list = lbList(), i = list.findIndex(function (f) { return f.id === LB.id; }), f = list[i];
    if (!f) return;

  /* ---------- relatório ---------- */
  var pdfLibPromise = null;
  function loadPdfLib() {
    if (window.PDFLib) return Promise.resolve(window.PDFLib);
    if (pdfLibPromise) return pdfLibPromise;
    pdfLibPromise = (async function () {
      for (var i = 0; i < PDFLIB_URLS.length; i++) {
        try {
          await new Promise(function (res, rej) {
            var s = document.createElement('script');
            s.src = PDFLIB_URLS[i]; s.async = true; s.onload = res; s.onerror = rej;
            document.head.appendChild(s);
          });
          if (window.PDFLib) return window.PDFLib;
        } catch (e) { /* tenta o próximo endereço */ }
      }
      throw { code: 'pdflib' };
    })();
    pdfLibPromise.catch(function () { pdfLibPromise = null; });
    return pdfLibPromise;
  }
  async function toPngBytes(bytes, type) {
    var url = URL.createObjectURL(new Blob([bytes], { type: type || 'image/webp' }));
    try {
      var img = new Image(); img.src = url; await img.decode();
      var c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      var b = await new Promise(function (r) { c.toBlob(r, 'image/png'); });
      return new Uint8Array(await b.arrayBuffer());
    } finally { URL.revokeObjectURL(url); }
  }
  function dataUrlBytes(u) {
    try { var bin = atob(String(u).split(',')[1] || ''); var out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out.length ? out : null; }
    catch (e) { return null; }
  }
  function safeFilename(s) {
    return String(s).replace(/[\\/:*?"<>|\u0000-\u001F]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 180);

  function escolherAvaliacoes(items) {
    var d = $('#dlg-rel'), list = $('#rel-list'), ok = $('#rel-ok'), cancel = $('#rel-cancel');

    list.onchange = sync;
    sync();
    return new Promise(function (res) {
      function done(v) { d.removeEventListener('close', onClose); ok.onclick = null; cancel.onclick = null; if (d.open) d.close(); res(v); }
      function onClose() { done(null); }
      ok.onclick = function () { done(Array.from(list.querySelectorAll('input:checked')).map(function (i) { return i.value; })); };
      cancel.onclick = function () { done(null); };
      d.addEventListener('close', onClose);
      d.showModal();
    });
  }
  async function gerarRelatorio(pid, btn) {
    var p = S.produtores.get(pid);
    if (!p || btn.disabled || !S.db) return;
    if (!S.downloads) { toast('Salvar arquivos não está disponível nesta visualização.', true); return; }
    btn.disabled = true;
    var prog = null;
    wake(true);
    try {
      var snap = await fotosCol(pid).get();
      var todas = sortFotos(snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
      var lista = evalList(p), av = p.avaliacoes || {};
      var evs = lista.map(function (e, i) { return { key: e.key, idx: i, a: e.a, fotos: todas.filter(function (f) { return f.aval === e.key; }) }; });
      uniqCI(todas.map(function (f) { return f.aval; }))
        .filter(function (k) { return /^a\d+$/.test(k) && !lista.some(function (e) { return e.key === k; }) && !(av[k] && av[k].removida); })
        .sort(function (a, b) { return evalNum(a) - evalNum(b); })
        .forEach(function (k) { evs.push({ key: k, idx: evs.length, a: av[k] || {}, fotos: todas.filter(function (f) { return f.aval === k; }) }); });
      var escolhidas = evs.filter(function (e) { return evalTemConteudo(e.a, e.fotos.length); });
      if (escolhidas.length >= 2) {
        var keys = await escolherAvaliacoes(escolhidas.map(function (e) {
          return { key: e.key, label: ordTitulo(e.idx), sub: [e.a.estadio ? 'Estádio ' + e.a.estadio : 'Sem estádio', e.a.data ? fmtDate(e.a.data) : null, fotosLabel(e.fotos.length)].filter(Boolean).join(' · ') };
        }));
        if (!keys) return;
        escolhidas = escolhidas.filter(function (e) { return keys.indexOf(e.key) >= 0; });
      }
      prog = openProgress('Gerando relatório', 'Carregando o gerador de PDF…');
      var PDFLib = await loadPdfLib();
      var total = escolhidas.reduce(function (s, e) { return s + e.fotos.length; }, 0);
      var feitas = 0, faltando = 0, diferentes = 0, secoes = [];
      for (var e of escolhidas) {
        var fotos = [];
        for (var f of e.fotos) {
          feitas++;
          prog.set('Baixando foto ' + feitas + ' de ' + total + ' (original)…', 0.05 + 0.8 * ((feitas - 1) / Math.max(1, total)));
          try {
            var r = await fetchsrcFoto(f);
            if (!r.ok) throw new Error('http ' + r.status);
            var buf = await r.arrayBuffer();
            if (f.sha256) { try { if (hex(await crypto.subtle.digest('SHA-256', buf)) !== f.sha256) diferentes++; } catch (x) { /* sem verificação */ } }
            fotos.push({ bytes: new Uint8Array(buf), nome: f.nome, tipo: f.tipo });
          } catch (x) { faltando++; fotos.push({ missing: true, nome: f.nome }); }
        }
        secoes.push({ titulo: ordTitulo(e.idx), curto: ordCurto(e.idx), estadio: e.a.estadio || '', data: e.a.data || '', obs: e.a.obs || '',
          popPadrao: e.a.popPadrao, popTeste: e.a.popTeste, fotos: fotos });
      }
      prog.set('Montando o PDF…', 0.9);
      var bytes = await buildReportPdf(PDFLib, {
        nome: p.nome, teste: p.teste, dose: p.dose, padraoFazenda: p.padraoFazenda, cultivar: p.cultivar, ciclo: p.ciclo, sementesMetro: p.sementesMetro, dataPlantio: p.dataPlantio,
        consultor: p.consultor, assistente: p.assistente, avaliacoes: secoes, geradoEm: todayISO(), logo: dataUrlBytes(LOGO_ESCURA)
      }, { toPng: toPngBytes });
      secoes = null;
      var blob = new Blob([bytes], { type: 'application/pdf' });
      bytes = null;
      prog.set('Pronto. Confirme para salvar o arquivo.', 1);
      var sufixo = escolhidas.length === 1 ? ordCurto(escolhidas[0].idx) + ' avaliação' : escolhidas.length ? 'avaliações' : 'cadastro';
      var filename = safeFilename('Relatório ' + (p.nome || 'produtor') + ' - ' + (p.teste || 'teste') + ' - ' + sufixo) + '.pdf';
      try {
        await S.downloads.save({ filename: filename, data: blob });
        prog.close();
        if (faltando) toast(faltando + (faltando === 1 ? ' foto não pôde ser baixada e aparece' : ' fotos não puderam ser baixadas e aparecem') + ' como indisponível no relatório.', true);
        else if (diferentes) toast('Atenção: ' + diferentes + ' foto(s) vieram diferentes do arquivo enviado.', true);
        else toast('Relatório salvo (' + fmtBytes(blob.size) + ')');
      } catch (x) {
        prog.close();
        if (!(x && x.code === 'declined')) toast(dlErrMsg(x), true);
      }
    } catch (err) {
      if (prog) prog.close();
      toast(err && err.code === 'pdflib' ? 'Não foi possível carregar o gerador de PDF. Verifique a conexão e tente de novo.' : 'Não foi possível gerar o relatório. Tente de novo.', true);
    } finally {
      btn.disabled = false;
      wake(false);
    }
  }

    if (FORM.busy || !S.db) return;
    ['nome', 'teste', 'cultivar', 'sem', 'plantio', 'form'].forEach(function (f) { setErr(f, ''); });
    var nome = clean($('#f-nome').value);
    var consultor = clean($('#f-consultor').value);
    var assistente = clean($('#f-assistente').value);
    var teste = clean(FORM.outro ? $('#f-outro').value : FORM.teste);
    var cultivar = clean($('#f-cultivar').value);
    var ciclo = clean($('#f-ciclo').value);
    var dose = clean($('#f-dose').value);
    var padraoFazenda = $('#f-padrao').value.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
    var semOn = !$('#sem-wrap').hidden;
    var sem = semOn ? parseNum($('#f-sem').value) : null;
    var plantio = $('#f-plantio').value;
    var first = null;
    function bad(field, msg, sel) { setErr(field, msg); if (!first) first = sel; }
    if (!nome) bad('nome', 'Informe o nome do produtor.', '#f-nome');
    if (!teste) bad('teste', FORM.outro ? 'Escreva o nome do teste.' : 'Escolha o tipo de teste.', FORM.outro ? '#f-outro' : '#f-tipos .pill');
    if (!cultivar) bad('cultivar', 'Informe a cultivar.', '#f-cultivar');
    if (semOn && sem !== null && !(sem > 0 && sem < 1000)) bad('sem', 'Use só números, por exemplo 3,2.', '#f-sem');
    if (!isISODate(plantio)) bad('plantio', 'Informe a data de plantio.', '#f-plantio');
    if (first) { var el = $(first); if (el) el.focus(); return; }

    var btn = $('#btn-salvar-prod');
    FORM.busy = true; btn.disabled = true; btn.textContent = 'Salvando…';
    var now = new Date().toISOString();
    var data = {
      nome: nome, consultor: consultor, assistente: assistente, teste: teste, dose: dose, padraoFazenda: padraoFazenda, cultivar: cultivar, ciclo: ciclo,
      sementesMetro: (typeof sem === 'number' && isFinite(sem)) ? sem : null, dataPlantio: plantio, atualizadoEm: now
    };
    var editing = FORM.pid;
    try {
      if (editing) {
        await dbw(function () { return prodRef(editing).update(data); });
        $('#dlg-prod').close();
        toast('Alterações salvas');
      } else {
        var id = newId('p');
        S.recent.add(id);
        setTimeout(function () { S.recent.delete(id); render(); }, 10000);
        await dbw(function () { return prodRef(id).set(Object.assign({}, data, { criadoEm: now, avaliacoes: {} })); });
        $('#dlg-prod').close();
        toast('Produtor criado');
        go('p-' + id);
      }
    } catch (err) {
      setErr('form', dbErrMsg(err));
      maybeReadOnly(err);
    } finally {
      FORM.busy = false; btn.disabled = false;
      btn.textContent = editing ? 'Salvar alterações' : 'Criar produtor';
    }
  });

  $('#btn-excluir-prod').addEventListener('click', async function () {
    var pid = FORM.pid, p = pid && S.produtores.get(pid);
    if (!p) return;
    var ok = await confirmDialog({ title: 'Excluir ' + (p.nome || 'este produtor') + '?', body: 'Os dados, as avaliações e todas as fotos deste produtor serão apagados da nuvem. Essa ação não pode ser desfeita.', ok: 'Excluir produtor' });
    if (!ok) return;
    $('#dlg-prod').close();
    var prog = openProgress('Excluindo produtor', 'Apagando fotos…');
    try {
      var snap = await fotosCol(pid).get();
      var i = 0;
      for (var d of snap.docs) {
        i++;
        prog.set('Apagando foto ' + i + ' de ' + snap.size + '…', i / (snap.size + 1));
        var aid = (d.data() || {}).assetId;
        await dbw(function () { return fotosCol(pid).doc(d.id).delete(); });
        if (S.assets && aid) { try { await S.assets.delete(aid); } catch (x) { /* arquivo já removido */ } }
      }
      await dbw(function () { return prodRef(pid).delete(); });
      prog.close();
      toast('Produtor excluído');
      go('inicio');
      loadUsage();
    } catch (e) { prog.close(); toast(dbErrMsg(e), true); maybeReadOnly(e); }
  });

  /* ---------- início ---------- */
  document.documentElement.lang = 'pt-BR';
  fillDatalist('#dl-estadios', STAGES);
  window.addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', function () { if (document.hidden && mounted && mounted.flush) mounted.flush(); });
  S.route = parseHash();
  render();

  (async function boot() {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') { S.failed = 'nohost'; render(); return; }
    var caps = await Promise.all(['db', 'assets', 'downloads', 'user', 'sample'].map(function (n) { return c.use(n).catch(function () { return null; }); }));
    S.db = caps[0]; S.assets = caps[1]; S.downloads = caps[2]; S.user = caps[3]; S.sample = caps[4];
    if (!S.db) { S.failed = 'nodb'; render(); return; }
    if (S.user) {
      try {
        var w = await S.user.can('data.write');
        if (w === false) S.canWrite = false;
        S.writeUnknown = w == null;
      } catch (e) { S.writeUnknown = true; }
    } else S.writeUnknown = true;
    subscribeProdutores();
    ensureFotos(S.route.pid || null);
    render();
    loadUsage();
  })();
})();
</script>
</body>
</html>
